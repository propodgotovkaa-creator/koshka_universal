<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Где мышка?</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;

    user-select: none;
    -webkit-user-select: none;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Arial, sans-serif;
    background: #ddd;
}

/* =========================================
   ИГРОВОЕ ПОЛЕ
========================================= */

#game {
    position: relative;

    width: 100vw;
    height: 100vh;

    overflow: hidden;

    background-image: url("fon.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

/* =========================================
   ВОПРОС
========================================= */

#questionText {
    position: absolute;

    left: 42%;
    top: 28%;

    transform:
        translateX(-50%)
        translateY(-10px);

    padding: 13px 27px;

    border-radius: 28px;

    background: rgba(255,255,255,0.90);

    color: #674629;

    font-size: clamp(20px, 2vw, 27px);
    font-weight: 700;

    white-space: nowrap;

    z-index: 110;

    opacity: 0;
    pointer-events: none;

    box-shadow:
        0 5px 15px rgba(0,0,0,0.12);

    transition:
        opacity 0.35s ease,
        transform 0.35s ease;
}

#questionText.show {
    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);
}

/* =========================================
   КОШКА
========================================= */

#cat {
    position: absolute;

    right: 4%;
    bottom: 13%;

    width: min(27vw, 410px);

    aspect-ratio: 1 / 1.35;

    z-index: 20;

    pointer-events: none;
}

#catBody {
    position: absolute;

    width: 100%;
    height: auto;

    left: 0;
    bottom: 0;

    z-index: 3;
}

#catTail {
    position: absolute;

    width: 47%;
    height: auto;

    right: -7%;
    bottom: 7%;

    z-index: 2;

    transform-origin: 25% 88%;

    animation:
        tailWag 2.7s ease-in-out infinite;
}

@keyframes tailWag {

    0% {
        transform: rotate(-7deg);
    }

    25% {
        transform: rotate(5deg);
    }

    50% {
        transform: rotate(10deg);
    }

    75% {
        transform: rotate(2deg);
    }

    100% {
        transform: rotate(-7deg);
    }
}

/* =========================================
   МЫШКА
========================================= */

#mouse {
    position: absolute;

    width: clamp(72px, 8vw, 105px);

    z-index: 45;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 0.25s ease,
        transform 0.25s ease;
}

#mouse img {
    display: block;

    width: 100%;
    height: auto;
}

#mouse.visible {
    opacity: 1;
}

/* =========================================
   ОБЛАСТЬ СТАКАНЧИКОВ
========================================= */

#cupsArea {
    position: absolute;

    left: 50%;
    bottom: 10%;

    width: min(64vw, 940px);
    height: 255px;

    transform: translateX(-50%);

    z-index: 30;
}

/* =========================================
   ОДИН СТАКАНЧИК
========================================= */

.cup-slot {
    position: absolute;

    width: clamp(145px, 16vw, 205px);
    height: 245px;

    bottom: 0;

    cursor: pointer;
}

.cup {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;

    z-index: 5;

    transition:
        transform 0.42s
        cubic-bezier(.3,.8,.3,1);
}

.cup-image {
    display: block;

    width: 100%;
    height: auto;

    object-fit: contain;

    pointer-events: none;
}

/* =========================================
   ФИКСИРОВАННЫЕ ПОЗИЦИИ
========================================= */

.position-0 {
    left: 6%;
}

.position-1 {
    left: 50%;

    transform: translateX(-50%);
}

.position-2 {
    right: 6%;
}

/* =========================================
   МЫШКА ПОД СТАКАНЧИКОМ
========================================= */

.hiddenMouse {
    position: absolute;

    left: 50%;
    bottom: 18px;

    width: clamp(65px, 7vw, 90px);

    transform: translateX(-50%);

    opacity: 0;

    z-index: 3;

    transition:
        opacity 0.22s ease;
}

.hiddenMouse img {
    display: block;

    width: 100%;
    height: auto;
}

.cup-slot.open .cup {
    transform:
        translateY(-118px);
}

.position-1.open .cup {
    transform:
        translateY(-118px);
}

.cup-slot.correct .hiddenMouse {
    opacity: 1;
}

/* =========================================
   КНОПКА
========================================= */

#nextButton {
    position: absolute;

    left: 41%;
    top: 36%;

    transform:
        translateX(-50%)
        scale(0.85);

    padding:
        15px 28px;

    border: none;
    border-radius: 32px;

    background: #72bb78;

    color: white;

    font-size: clamp(19px, 2vw, 25px);
    font-weight: 700;

    cursor: pointer;

    opacity: 0;
    pointer-events: none;

    z-index: 120;

    box-shadow:
        0 6px 18px
        rgba(0,0,0,0.16);

    transition:
        opacity 0.3s ease,
        transform 0.3s ease;
}

#nextButton.show {
    opacity: 1;

    pointer-events: auto;

    transform:
        translateX(-50%)
        scale(1);
}

/* =========================================
   ФИНАЛ
========================================= */

#finishScreen {
    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    background:
        rgba(80,55,40,0.28);

    backdrop-filter:
        blur(3px);

    -webkit-backdrop-filter:
        blur(3px);

    z-index: 500;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 0.4s ease;
}

#finishScreen.show {
    opacity: 1;

    pointer-events: auto;
}

.finishCard {
    width: min(620px, 80vw);

    padding:
        42px 50px;

    text-align: center;

    background:
        rgba(255,250,238,0.97);

    border-radius: 38px;

    box-shadow:
        0 18px 50px
        rgba(70,45,30,0.28);

    transform:
        translateY(40px)
        scale(0.85);

    opacity: 0;

    transition:
        transform 0.5s
        cubic-bezier(.2,.9,.3,1.2),
        opacity 0.4s ease;
}

#finishScreen.show .finishCard {
    transform:
        translateY(0)
        scale(1);

    opacity: 1;
}

.finishEmoji {
    font-size: 65px;

    margin-bottom: 12px;
}

.finishCard h1 {
    margin-bottom: 12px;

    color: #674629;

    font-size:
        clamp(30px, 4vw, 42px);
}

.finishCard p {
    color: #805d3f;

    font-size:
        clamp(22px, 3vw, 30px);

    font-weight: 600;
}

/* =========================================
   ВЫСОКИЕ / УЗКИЕ ЭКРАНЫ
========================================= */

@media (max-aspect-ratio: 4/3) {

    #cat {
        width: min(30vw, 350px);
        right: 1%;
        bottom: 11%;
    }

    #cupsArea {
        width: 78vw;
        bottom: 9%;
    }

    .cup-slot {
        width: clamp(130px, 21vw, 180px);
    }

    #questionText {
        left: 42%;
        top: 26%;
    }

    #nextButton {
        left: 41%;
        top: 35%;
    }
}

/* =========================================
   ОЧЕНЬ ШИРОКИЕ ЭКРАНЫ
========================================= */

@media (min-aspect-ratio: 16/9) {

    #cupsArea {
        width: min(58vw, 900px);
        bottom: 9%;
    }

    #cat {
        bottom: 11%;
    }

    #questionText {
        top: 27%;
    }

    #nextButton {
        top: 35%;
    }
}


/* Responsive cup positions use percentages so resizing preserves the shuffle. */
#cupsArea { left: 40%; width: min(70vw, 950px); height: 40vh; bottom: 9%; }
.cup-slot { width: 29%; height: auto; aspect-ratio: 1 / 1.2; transform: translateX(-50%); border: 0; padding: 0; background: transparent; color: inherit; }
.cup-slot:disabled { cursor: default; }
.cup-slot:focus-visible { outline: 3px solid #674629; outline-offset: 5px; border-radius: 20px; }
.cup-slot.open .cup { transform: translateY(-105%); }
.hiddenMouse { width: 48%; bottom: 12%; }
#mouse { width: clamp(42px, 7vw, 95px); z-index: 31; transition: opacity .18s; }
#questionText { left: 40%; top: 18%; max-width: 94vw; white-space: normal; text-align: center; }
#nextButton { left: 40%; top: 30%; }
#restartButton { margin-top: 24px; border: 0; border-radius: 24px; padding: 14px 24px; background: #72bb78; color: white; font-size: 20px; cursor: pointer; }
#finishScreen:not(.show) { visibility: hidden; }
@media (max-aspect-ratio: 4/3) {
  #cupsArea { left: 50%; width: 96vw; bottom: 12%; }
  #cat { bottom: 42%; width: 27vw; }
  #questionText, #nextButton { left: 50%; }
  .finishCard { padding: 28px 20px; }
}
@media (max-height: 500px) and (min-aspect-ratio: 4/3) {
  #cupsArea { width: min(60vw, 95vh); }
  #questionText { top: 7%; }
  #nextButton { top: 23%; }
}

/* One shared size keeps the running and revealed mouse identical. */
#game { --mouse-size: clamp(48px, 8vw, 108px); }
#mouse, .hiddenMouse { width: var(--mouse-size); }
#instructionPanel {
    position: absolute;
    top: clamp(16px, 5vh, 54px);
    left: 50%;
    transform: translateX(-50%);
    width: min(520px, calc(100% - 32px));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    z-index: 120;
    pointer-events: none;
}
#questionText, #questionText.show {
    position: relative;
    left: auto; top: auto;
    transform: none;
    width: 100%; min-height: 76px;
    display: flex; align-items: center; justify-content: center;
    padding: 18px 24px;
    border: 2px solid #dcc5a2;
    border-radius: 28px;
    background: linear-gradient(180deg, #fffaf0, #f6e9d2);
    box-shadow: 0 5px 0 #c4a77d55, 0 10px 22px #67462924, inset 0 2px 0 #fff;
    color: #674629;
    font-size: clamp(20px, 2.4vw, 28px);
    line-height: 1.25;
    white-space: normal;
    text-align: center;
}
#questionText.text-changing { opacity: 0; }
#nextButton, #nextButton.show {
    position: relative;
    top: auto; left: auto;
    transform: none;
    margin: 0;
    border: 2px solid #87a36a;
    padding: 12px 25px;
    border-radius: 24px;
    background: linear-gradient(#a5bc82, #829e64);
    color: #fffdf5;
    font-size: clamp(18px, 2vw, 23px);
    box-shadow: 0 4px 0 #627c4940, inset 0 2px 0 #ffffff40;
}
#nextButton:not(.show) { visibility: hidden; }
#nextButton.show { pointer-events: auto; }
#nextButton:focus-visible { outline: 3px solid #674629; outline-offset: 4px; }
@media (max-height: 500px) {
    #instructionPanel { top: 10px; gap: 8px; width: min(460px, calc(100% - 32px)); }
    #questionText { min-height: 52px; padding: 10px 18px; }
    #nextButton { padding: 8px 20px; }
}

#mouse { transition: none; }
#mouse.inside-cup { z-index: 3; }
#rulesDialog {
    position: fixed; inset: 0; margin: auto;
    width: min(580px, calc(100vw - 36px));
    max-height: calc(100dvh - 36px); overflow: auto;
    border: 2px solid #dcc5a2; border-radius: 30px;
    padding: clamp(24px, 5vw, 42px);
    background: linear-gradient(180deg, #fffaf0, #f6e9d2);
    box-shadow: 0 18px 60px #67462940, inset 0 2px 0 white;
    color: #674629; text-align: center;
}
#rulesDialog[open] { animation: rulesArrival .5s cubic-bezier(.2,.8,.3,1); }
#rulesDialog::backdrop { background: #50372855; backdrop-filter: blur(3px); }
#rulesDialog h2 { font-size: clamp(26px, 4vw, 34px); margin-bottom: 20px; }
#rulesDialog p { font-size: clamp(20px, 2.6vw, 25px); line-height: 1.5; }
#startButton {
    margin-top: 26px; padding: 14px 28px; border: 2px solid #87a36a;
    border-radius: 24px; background: linear-gradient(#a5bc82, #829e64);
    color: #fffdf5; font-size: 22px; font-weight: bold; cursor: pointer;
    box-shadow: 0 4px 0 #627c4940, inset 0 2px 0 #ffffff40;
}
#startButton:disabled { opacity: .65; cursor: wait; }
#startButton:focus-visible { outline: 3px solid #674629; outline-offset: 4px; }
@keyframes rulesArrival {
    from { opacity: 0; transform: translateY(35px) scale(.94); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}
@media (prefers-reduced-motion: reduce) { #rulesDialog[open] { animation: none; } }
</style>
</head>

<body>

<div id="game">

    <div id="instructionPanel">
    <div id="questionText" role="status" aria-live="polite">
        Где мышка?
    </div>


    <button id="nextButton" disabled>Играть дальше</button>
    </div>

    <div id="cat">

        <img
            id="catTail"
            src="cat-tail.png"
            alt=""
            draggable="false"
        >

        <img
            id="catBody"
            src="cat-body.png"
            alt=""
            draggable="false"
        >

    </div>


    <div id="mouse">

        <img
            src="mouse.png"
            alt=""
            draggable="false"
        >

    </div>


    <div id="cupsArea"></div>





    <div id="finishScreen">

        <div class="finishCard">

            <div class="finishEmoji">
                🎉
            </div>

            <h1>
                Отлично поиграли!
            </h1>

            <p>
                Все 10 раундов пройдены!
            </p>
            <button id="restartButton">Играть ещё раз</button>
        </div>

    </div>

</div>


<dialog id="rulesDialog" aria-labelledby="rulesTitle" aria-describedby="rulesText">
    <h2 id="rulesTitle">Как играть?</h2>
    <p id="rulesText">Помоги кошке найти мышку. Пока стаканчики перемешиваются, проговаривай любую цепочку слогов.</p>
    <button id="startButton" type="button" disabled>Загружаем рисунки…</button>
</dialog>
<script>
const TOTAL_ROUNDS = 10;
const game = document.getElementById('game');
const cupsArea = document.getElementById('cupsArea');
const mouse = document.getElementById('mouse');
const questionText = document.getElementById('questionText');
const nextButton = document.getElementById('nextButton');
const finishScreen = document.getElementById('finishScreen');
let currentRound = 0;
let mouseCupID = 0;
let phase = 'loading';
let cups = [];
const positions = [17, 50, 83];
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
let messageTimer;
function message(text) {
    clearTimeout(messageTimer);
    questionText.classList.add('text-changing');
    messageTimer = setTimeout(() => {
        questionText.textContent = text;
        questionText.classList.remove('text-changing');
        questionText.classList.add('show');
    }, 180);
}
function enableCups(enabled) {
    cups.forEach(cup => cup.disabled = !enabled);
}
function createCups() {
    cupsArea.replaceChildren();
    cups = Array.from({length: 3}, (_, id) => {
        const cup = document.createElement('button');
        cup.type = 'button';
        cup.className = 'cup-slot';
        cup.dataset.id = id;
        cup.dataset.position = id;
        cup.style.left = positions[id] + '%';
        cup.setAttribute('aria-label', `Стаканчик ${id + 1}`);
        cup.innerHTML = '<span class="cup"><img class="cup-image" src="red-cup.png" alt="" draggable="false"></span>';
        cup.disabled = true;
        cup.addEventListener('click', () => chooseCup(cup));
        cupsArea.append(cup);
        return cup;
    });
}
async function runMouseIntoCup() {
    const target = cups[mouseCupID];
    target.classList.add('open');
    await wait(450);
    const field = game.getBoundingClientRect();
    const rect = target.getBoundingClientRect();
    const startX = -mouse.offsetWidth;
    const endX = rect.left - field.left + rect.width / 2 - mouse.offsetWidth / 2;
    const endY = rect.bottom - field.top - mouse.offsetHeight - rect.height * .12;
    mouse.style.left = '0px';
    mouse.style.top = endY + 'px';
    mouse.classList.add('visible');
    const run = mouse.animate([
        {transform: `translateX(${startX}px)`},
        {transform: `translateX(${endX}px)`}
    ], {duration: 1400, easing: 'ease-in-out', fill: 'forwards'});
    await run.finished;
    // Keep the SAME visible sprite: move it into the cup's stacking context
    // in one frame, with no opacity cross-fade or second image to decode.
    target.append(mouse);
    mouse.classList.add('inside-cup');
    mouse.style.left = '50%';
    mouse.style.top = 'auto';
    mouse.style.bottom = '12%';
    mouse.style.transform = 'translateX(-50%)';
    run.cancel();
    target.classList.remove('open');
    await wait(450);
}
async function shuffleCups() {
    message('Следи за стаканчиками!');
    for (let step = 0; step < 5; step++) {
        // Keep the original random swaps, including the mouse in the first one.
        const first = step === 0 ? mouseCupID : Math.floor(Math.random() * 3);
        const second = (first + 1 + Math.floor(Math.random() * 2)) % 3;
        const a = cups[first], b = cups[second];
        const pa = Number(a.dataset.position), pb = Number(b.dataset.position);
        a.style.zIndex = '2';
        b.style.zIndex = '1';
        const duration = Math.max(580, 950 - currentRound * 35);
        const animations = [[a, pa, pb, -14], [b, pb, pa, 14]].map(([cup, from, to, arc]) =>
            cup.animate([
                {left: positions[from] + '%', transform: 'translate(-50%, 0)'},
                {left: (positions[from] + positions[to]) / 2 + '%', transform: `translate(-50%, ${arc}%)`},
                {left: positions[to] + '%', transform: 'translate(-50%, 0)'}
            ], {duration, easing: 'ease-in-out', fill: 'forwards'})
        );
        await Promise.all(animations.map(animation => animation.finished));
        // Hold the final frame until BOTH stored positions are updated.
        // Otherwise a finished animation can briefly show the old position.
        a.dataset.position = pb;
        b.dataset.position = pa;
        a.style.left = positions[pb] + '%';
        b.style.left = positions[pa] + '%';
        animations.forEach(animation => animation.cancel());
        a.style.zIndex = b.style.zIndex = '';
        await wait(180);
    }
    cups.forEach(cup => cup.setAttribute('aria-label', `Стаканчик ${Number(cup.dataset.position) + 1}`));
}
async function startRound() {
    phase = 'hiding';
    nextButton.classList.remove('show');
    nextButton.disabled = true;
    mouse.classList.remove('visible', 'inside-cup');
    game.append(mouse);
    mouse.style.bottom = 'auto';
    mouse.style.transform = '';
    createCups();
    mouseCupID = Math.floor(Math.random() * 3);
    message('Смотри, куда бежит мышка!');
    await wait(500);
    await runMouseIntoCup();
    phase = 'shuffling';
    await shuffleCups();
    phase = 'choosing';
    message('Где мышка?');
    enableCups(true);
}
async function chooseCup(cup) {
    if (phase !== 'choosing') return;
    phase = 'revealing';
    enableCups(false);
    cup.classList.add('open');
    if (Number(cup.dataset.id) !== mouseCupID) {
        message('Здесь пусто. Попробуй ещё!');
        await wait(1000);
        cup.classList.remove('open');
        await wait(450);
        phase = 'choosing';
        enableCups(true);
        return;
    }
    cup.classList.add('correct');
    message('Вот мышка! Молодец!');
    await wait(900);
    phase = 'solved';
    if (currentRound === TOTAL_ROUNDS - 1) {
        phase = 'finished';
        finishScreen.classList.add('show');
        document.getElementById('restartButton').focus();
    } else {
        nextButton.disabled = false;
        nextButton.classList.add('show');
    }
}
nextButton.addEventListener('click', () => {
    if (phase !== 'solved') return;
    currentRound++;
    startRound();
});
document.getElementById('restartButton').addEventListener('click', () => {
    if (phase !== 'finished') return;
    finishScreen.classList.remove('show');
    currentRound = 0;
    startRound();
});
const rulesDialog = document.getElementById('rulesDialog');
const startButton = document.getElementById('startButton');
rulesDialog.addEventListener('cancel', event => event.preventDefault());
rulesDialog.showModal();
startButton.addEventListener('click', () => {
    if (phase !== 'ready') return;
    startButton.disabled = true;
    rulesDialog.close();
    startRound();
});
// Load images while the rules are visible; start only after the player clicks.
Promise.all(['mouse.png', 'red-cup.png'].map(src => {
    const image = new Image();
    image.src = src;
    return image.decode();
})).then(() => {
    phase = 'ready';
    createCups();
    startButton.disabled = false;
    startButton.textContent = 'Начать игру';
    startButton.focus();
}).catch(() => {
    startButton.textContent = 'Обнови страницу';
    document.getElementById('rulesText').textContent = 'Не удалось загрузить рисунки. Обнови страницу, чтобы попробовать ещё раз.';
});
</script>

</body>
</html>
